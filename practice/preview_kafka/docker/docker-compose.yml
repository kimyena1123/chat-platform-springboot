# docker-compose.yml (설명용 주석 포함)

services:
  # ------------------------------- #
  # 1) Kafka 브로커/컨트롤러 - 1번 노드
  # ------------------------------- #
  kafka1:
    image: bitnamilegacy/kafka:3.9.0-debian-12-r13   # Bitnami에서 제공하는 Kafka 이미지를 사용
    restart: unless-stopped                    # 컨테이너가 꺼져도 다시 켜지도록(수동 stop除外)
    ports:
      - "19094:9094"                           # 호스트포트 19094 → 컨테이너포트 9094(EXTERNAL 리스너)
    environment:
      - KAFKA_CFG_NODE_ID=1                    # 이 브로커의 고유 노드 ID(1)
      - KAFKA_KRAFT_CLUSTER_ID=2ce827af-446c-456f-9bf9-c2de30f1d3b5     # KRaft(=Zookeeper 없는 모드) 클러스터 ID. 모든 노드가 동일해야 함. 만드는법: UUID.randomUUID()
      - KAFKA_CFG_PROCESS_ROLES=broker,controller   # 이 노드가 broker + controller 역할을 동시에 수행
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      # 컨트롤러 투표 참여자 목록(3대 모두): 노드ID@호스트:컨트롤러포트(9093)
      - ALLOW_PLAINTEXT_LISTENER=yes           # Bitnami 전용 플래그: 평문(SSL 없음) 허용 (연습/로컬에서 편하게)
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER  # 컨트롤러용 리스너 이름
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL   # 브로커 간 통신에 INTERNAL 리스너를 사용
      - KAFKA_CFG_LISTENERS=INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
        # 이 컨테이너가 열 리스너 3개:
        #  - INTERNAL(9092): 컨테이너들끼리 통신(도커 네트워크 내부)
        #  - CONTROLLER(9093): 컨트롤러 쿼럼 통신
      #  - EXTERNAL(9094): 로컬 PC(호스트)에서 접속할 때 사용(포트 매핑 19094로 노출)
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka1:9092,EXTERNAL://localhost:19094
        # 클라이언트에게 "내 접속 정보는 이걸로 써!"라고 알려주는 주소.
        #  - 컨테이너 내부/다른 컨테이너 → kafka1:9092 (INTERNAL)
      #  - 로컬 PC 애플리케이션 → localhost:19094 (EXTERNAL)
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      # 각 리스너 이름별 보안 프로토콜(연습용이라 모두 PLAINTEXT)
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      # 카프카 내부 오프셋 토픽의 복제 팩터 = 3 (브로커 3대니까 3으로)
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=2
      # 트랜잭션 로그 토픽 복제/ISR 설정(프로듀서 정확한 전달을 위한 내구성 관련)
      - KAFKA_CFG_MIN_INSYNC_REPLICAS=2
      # 최소 In-Sync 복제본 2개 필요(가용성/내구성 트레이드오프)
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
      # 자동 토픽 생성 비활성화(명시적으로 토픽을 직접 만들게 하려고)
      - KAFKA_CFG_LOG_DIRS=/bitnami/kafka/data
      # 카프카 데이터 저장 경로(컨테이너 내부 경로)
    volumes:
      - ./data/kafka1:/bitnami/kafka/data
        # 호스트의 ./data/kafka1 ↔ 컨테이너의 /bitnami/kafka/data 바인드 마운트
      # → 컨테이너가 내려가도 데이터(토픽/메타데이터) 유지

  # ------------------------------- #
  # 2) Kafka - 2번 노드
  # ------------------------------- #
  kafka2:
    image: bitnamilegacy/kafka:3.9.0-debian-12-r13
    restart: unless-stopped
    ports:
      - "19095:9094"                           # 이 노드는 호스트 19095로 EXTERNAL 노출
    environment:
      - KAFKA_CFG_NODE_ID=2
      - KAFKA_KRAFT_CLUSTER_ID=2ce827af-446c-456f-9bf9-c2de30f1d3b5     # 1번과 동일해야 같은 클러스터로 인식
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CFG_LISTENERS=INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka2:9092,EXTERNAL://localhost:19095
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=2
      - KAFKA_CFG_MIN_INSYNC_REPLICAS=2
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_CFG_LOG_DIRS=/bitnami/kafka/data
    volumes:
      - ./data/kafka2:/bitnami/kafka/data

  # ------------------------------- #
  # 3) Kafka - 3번 노드
  # ------------------------------- #
  kafka3:
    image: bitnamilegacy/kafka:3.9.0-debian-12-r13
    restart: unless-stopped
    ports:
      - "19096:9094"                           # 이 노드는 호스트 19096으로 EXTERNAL 노출
    environment:
      - KAFKA_CFG_NODE_ID=3
      - KAFKA_KRAFT_CLUSTER_ID=2ce827af-446c-456f-9bf9-c2de30f1d3b5
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CFG_LISTENERS=INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka3:9092,EXTERNAL://localhost:19096
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=2
      - KAFKA_CFG_MIN_INSYNC_REPLICAS=2
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_CFG_LOG_DIRS=/bitnami/kafka/data
    volumes:
      - ./data/kafka3:/bitnami/kafka/data

  # ------------------------------- #
  # 4) Kafka UI (웹 관리도구)
  # ------------------------------- #
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2       # Kafka UI 이미지
    restart: unless-stopped
    ports:
      - '18090:8080'                           # http://localhost:18090 으로 접속
    environment:
      - KAFKA_CLUSTERS_0_NAME=Local-Kafka-Cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka1:9092,kafka2:9092,kafka3:9092
      # UI는 "도커 네트워크 내부"에서 카프카에 붙으므로 INTERNAL 주소(호스트명 kafka1/2/3, 포트 9092)로 연결
    volumes:
      - ./data/kafkaui:/etc/kafkaui            # UI 설정/상태 유지(선택)
    depends_on:
      - kafka1
      - kafka2
      - kafka3
      # UI는 브로커들이 먼저 올라온 다음 실행
