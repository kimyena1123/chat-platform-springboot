# 개발환경에서 사용되는 MySQL을 직접 설치하지 않고 컨테이너로 관리할 수 있게 해준다.

services: # 실행할 컨테이너(서비스)들을 정의하는 영역
  mysql-source:
    image: mysql:8.0.40
    restart: unless-stopped                 # 컨테이너가 죽어도 자동 재시작
    healthcheck: # 컨테이너 내부에서 MySQL이 "정상 응답"하는지 검사.
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s                         # 10초 간격으로 체크
      timeout: 5s                           # 5초 안에 응답 없으면 실패
      retries: 3                            # 연속 3번 실패 시 unhealthy
    environment:
      # MySQL 초기화 환경변수: 데이터 디렉터리가 비어있을 때만 1회 반영
      MYSQL_ROOT_PASSWORD: root_password    # root 계정 비밀번호
      MYSQL_DATABASE: messagesystem               # 초기 DB 하나 만들기 (예: library)
      MYSQL_USER: dev_user                  # 일반 계정 생성
      MYSQL_PASSWORD: dev_password          # 일반 계정 비밀번호
    ports:
      - "13306:3306"                        # 호스트:컨테이너 포트 매핑. 로컬에서 13306으로 접속
    volumes:
      # MySQL 데이터 저장소. 로컬 ./data/mysql-source 에 데이터가 영구 보관됨.
      - ./data/mysql-source:/var/lib/mysql
      # 최초 초기화 시 실행할 SQL/SH 스크립트 폴더를 컨테이너의 /docker-entrypoint-initdb.d 로 마운트
      - ./init-scripts-source:/docker-entrypoint-initdb.d #위 mysql-source 이미지로부터 컨테이너가 실행될 때 이 디렉토리에 있는 mysql 파일을 순차적으로 실행시켜준다.
    # command: MySQL 서버 옵션. GTID 기반 복제를 위한 핵심 플래그들.
    #      --server-id=1                         # 복제 트리에서 유일한 서버 ID
    #      --log_bin=/var/lib/mysql/mysql-bin.log
    #      --enforce-gtid-consistency=ON         # GTID 일관성 보장 (DDL 제약)
    #      --gtid-mode=ON                        # GTID 활성화
    command: >
      --server-id=1
      --log_bin=/var/lib/mysql/mysql-bin.log
      --enforce-gtid-consistency=ON
      --gtid-mode=ON

  mysql-replica:
    image: mysql:8.0.40
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password    # Replica는 root 비번만 있으면 됨(초기화만)
    ports:
      - "13307:3306"
    volumes:
      - ./data/mysql-replica:/var/lib/mysql
      # Replica 쪽도 "최초 초기화 시" 실행할 스크립트를 마운트 (복제 자동 설정)
      - ./init-scripts-replica:/docker-entrypoint-initdb.d
    depends_on: #컨테이너를 실행할 때 순서를 맞춰주도록 dependency 걸어준다.
      mysql-source: # "mysql-source"가 healthy 일 때까지 기다렸다가 이 컨테이너를 기동.
        condition: service_healthy
    command: >
      --server-id=2
      --relay_log=/var/lib/mysql/mysql-relay-bin.log
      --enforce-gtid-consistency=ON
      --gtid-mode=ON
      --read-only=1

  redis:
    image: redis:7.4.1
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - ./data/redis:/data

  redis-insight:
    image: redis/redisinsight:2.64.1
    restart: unless-stopped
    ports:
      - "15540:5540"
    volumes:
      - ./data/redis-insight:/data